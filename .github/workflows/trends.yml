name: trends
# Atualiza o radar de trends (TikTok Creative Center + Google Trends) a cada 3 horas.
on:
  schedule:
    - cron: '23 */3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/trends.mjs', '.github/workflows/trends.yml']
permissions:
  contents: write
concurrency:
  group: trends
  cancel-in-progress: false
jobs:
  trends:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i --no-save --no-audit --no-fund playwright@1 && npx playwright install --with-deps chromium
      - run: node scripts/trends.mjs
      - name: Commit
        run: |
          if git diff --quiet src/lib/data/trends-live.json src/lib/data/trends-meta.json; then echo "sem mudanças"; exit 0; fi
          git config user.name "famefile-bot"
          git config user.email "famefile-bot@users.noreply.github.com"
          git add src/lib/data/trends-live.json src/lib/data/trends-meta.json
          git commit -m "Trends: radar atualizado"
          git pull --rebase origin main
          git push origin HEAD:main
